<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with Safe Margin -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Central Laser Cutting Shield / Disc -->
  <g transform="translate(256, 220)">
    <!-- Outer Precision Ring -->
    <circle r="150" fill="none" stroke="url(#blueGrad)" stroke-width="6" stroke-dasharray="24 12" opacity="0.8" />
    <circle r="130" fill="#0f172a" stroke="#1e293b" stroke-width="4" />
    <circle r="115" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.5" />

    <!-- Industrial Metal Cut Crosshair Lines -->
    <line x1="-165" y1="0" x2="-125" y2="0" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="125" y1="0" x2="165" y2="0" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="-165" x2="0" y2="-125" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="125" x2="0" y2="165" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

    <!-- Stylized Cutting Diamond & Sparks -->
    <polygon points="0,-105 105,0 0,105 -105,0" fill="none" stroke="url(#blueGrad)" stroke-width="5" opacity="0.7" />

    <!-- Stylized "U" and "C" Industrial Monogram -->
    <path d="M -50,-60 L -50,15 C -50,55 -25,75 0,75 C 25,75 50,55 50,15 L 50,-60" 
          fill="none" stroke="url(#blueGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Laser Cut Notch Through U forming C shape and Spark -->
    <path d="M 48,-15 C 38,32 15,48 -10,48 C -35,48 -48,25 -48,-10 C -48,-45 -25,-55 10,-55 C 32,-55 45,-40 48,-25" 
          fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

    <!-- Laser Spark / Plasma Core -->
    <circle cx="0" cy="5" r="14" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="0" cy="5" r="7" fill="#ffffff" />
    <polygon points="0,-22 4,5 28,5 8,14 14,35 0,22 -14,35 -8,14 -28,5 -4,5" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- Typography: USICORTE METAIS -->
  <text x="256" y="415" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#ffffff" 
        text-anchor="middle">
    USICORTE
  </text>
  <text x="256" y="450" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="8" 
        fill="#38bdf8" 
        text-anchor="middle">
    METAIS &amp; CORTES
  </text>
</svg>
